[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-toolbox"
version = "0.1.0"
description = "Small developer utilities for everyday repository work"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
sandbox = "sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
